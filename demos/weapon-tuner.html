<!doctype html><html><head><meta charset="utf-8"><title>Warcrest — Weapon Placement Tuner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root{--bg:#12161c;--panel:#1b2129;--ink:#e7edf3;--dim:#8b97a4;--brass:#c79a42;--line:#2c343e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  #wrap{display:flex;height:100%}
  #view{flex:1;position:relative}
  canvas{display:block}
  #panel{width:320px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto}
  h1{font-size:14px;margin:0 0 4px;color:var(--brass);letter-spacing:.5px}
  .sub{color:var(--dim);font-size:11px;margin:0 0 12px}
  .units{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .u{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#232b34;cursor:pointer;font-size:11px}
  .u.on{background:var(--brass);color:#1a1a1a;border-color:var(--brass);font-weight:600}
  .row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .chip{padding:4px 9px;border:1px solid var(--line);border-radius:14px;background:#232b34;cursor:pointer;font-size:11px}
  .chip.on{background:#2f6d4a;border-color:#3d8f61;color:#fff}
  label{display:block;margin:9px 0 2px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between}
  label b{color:var(--ink);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--brass)}
  .grp{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px}
  .grp h2{font-size:11px;margin:0 0 4px;color:var(--brass);text-transform:uppercase;letter-spacing:.6px}
  textarea{width:100%;height:74px;background:#0e1217;color:#bfe3c9;border:1px solid var(--line);border-radius:6px;font:11px/1.3 ui-monospace,monospace;padding:6px;resize:vertical}
  button.act{width:100%;padding:8px;margin-top:6px;background:var(--brass);color:#1a1a1a;border:0;border-radius:6px;font-weight:600;cursor:pointer}
  button.sm{padding:4px 8px;background:#232b34;color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:11px}
  #bone{color:var(--dim);font-size:10px;margin-top:6px;word-break:break-all}
  #hint{position:absolute;left:10px;bottom:10px;color:var(--dim);font-size:11px;background:rgba(0,0,0,.4);padding:5px 8px;border-radius:6px}
  #status{position:absolute;left:10px;top:10px;color:var(--dim);font-size:11px}
</style></head>
<body><div id="wrap">
  <div id="view"><div id="status">loading…</div><div id="hint">drag = orbit · wheel/pinch = zoom</div></div>
  <div id="panel">
    <h1>WEAPON PLACEMENT TUNER</h1>
    <p class="sub">Every unit + its weapon on the live hand bone. Tune, then copy the entry into <code>WEAPONS</code>.</p>
    <div class="units" id="units"></div>
    <div class="row" id="anims"></div>
    <div class="row" id="props"></div>
    <div class="grp">
      <h2>Position</h2>
      <label>X <b id="vpx">0</b></label><input type="range" id="px" min="-10" max="10" step="0.05" value="0">
      <label>Y <b id="vpy">0</b></label><input type="range" id="py" min="-10" max="10" step="0.05" value="0">
      <label>Z <b id="vpz">0</b></label><input type="range" id="pz" min="-10" max="10" step="0.05" value="0">
    </div>
    <div class="grp">
      <h2>Rotation (°)</h2>
      <label>X <b id="vrx">0</b></label><input type="range" id="rx" min="-180" max="180" step="1" value="0">
      <label>Y <b id="vry">0</b></label><input type="range" id="ry" min="-180" max="180" step="1" value="0">
      <label>Z <b id="vrz">0</b></label><input type="range" id="rz" min="-180" max="180" step="1" value="0">
    </div>
    <div class="grp">
      <h2>Scale</h2>
      <label>× <b id="vsc">1</b></label><input type="range" id="sc" min="0.1" max="3" step="0.02" value="1">
    </div>
    <div id="bone"></div>
    <div class="grp">
      <h2>WEAPONS entry</h2>
      <textarea id="out" readonly></textarea>
      <button class="act" id="copy">Copy entry</button>
      <div class="row" style="margin-top:6px"><button class="sm" id="reset">Reset weapon</button><button class="sm" id="dumpall">Dump ALL units</button></div>
    </div>
  </div>
</div>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/fflate.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/vendor/FBXLoader.js"></script>
<script src="/vendor/SkeletonUtils.js"></script>
<script>
// ---- data mirrored from demos/thronefall-level.html (keep in sync) ----
const CHAR_H={thoryn:4.8, queen:4.4, paladin:4.4, archer:3.6, priestess:3.8, warrior:3.9, chief:4.9, orcarcher:3.7, orcgrunt:3.7, orcwarrior:4.1, orcshaman:3.7};
const WEAPONS={
  queen:    [{file:'glaive_elf_queen', bone:'hand_r', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
  paladin:  [{file:'hammer_human_paladin', bone:'hand_r', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
  archer:   [{file:'bow_elf_archer',   bone:'hand_l', pos:[0,0,0], rot:[0,0,Math.PI/2], scl:1}],
  priestess:[{file:'magic_ball',       bone:'hand_r', pos:[0,4,0], rot:[0,0,0],         scl:0.6}],
  warrior:  [{file:'sword_elf_warrior', bone:'hand_r', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1},
             {file:'shield_elf_warrior',bone:'hand_l', pos:[0,0,0], rot:[0,Math.PI/2,0], scl:0.8}],
  chief:    [{file:'axe_orc_chieftain', bone:'hand_r', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
  orcarcher:[{file:'bow_orc_archer',    bone:'hand_l', pos:[0,0,0], rot:[0,0,Math.PI/2], scl:1}],
  orcgrunt: [{file:'axe_orc_grunt',     bone:'Character1_RightHand', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
  orcwarrior:[{file:'sword_orc_warrior',bone:'Character1_RightHand', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
  orcshaman:[{file:'staff_orc_shaman', bone:'hand_r', pos:[0,0,0], rot:[Math.PI/2,0,0], scl:1}],
};
const RIG_SPECS=[['thoryn','thoryn'],['queen','elf_queen'],['paladin','human_paladin'],['archer','elf_archer'],['priestess','elf_priestess'],['warrior','elf_warrior'],['chief','orc_chieftain'],['orcarcher','orc_archer'],['orcgrunt','orc_grunt'],['orcwarrior','orc_warrior'],['orcshaman','orc_shaman']];
const LABEL={thoryn:'Thoryn',queen:'Queen',paladin:'Paladin',archer:'Elf Archer',priestess:'Priestess',warrior:'Elf Warrior',chief:'Chieftain',orcarcher:'Orc Archer',orcgrunt:'Orc Grunt',orcwarrior:'Orc Warrior',orcshaman:'Orc Shaman'};
const R2D=180/Math.PI, D2R=Math.PI/180, fmtR=v=>{ // pretty-print radians, snapping to π fractions
  const t=[[0,'0'],[Math.PI/2,'Math.PI/2'],[-Math.PI/2,'-Math.PI/2'],[Math.PI,'Math.PI'],[-Math.PI,'-Math.PI']];
  for(const [x,s] of t) if(Math.abs(v-x)<0.02) return s; return (+v.toFixed(3)); };

const RIGS={}, PROPS={}, TEXS={};
function bakeStatic(o){ o.updateMatrixWorld(true); const parts=[]; let had=false;
  o.traverse(n=>{ if(!n.isMesh)return; if(n.isSkinnedMesh)had=true; const m=new THREE.Mesh(n.geometry,n.material); m.applyMatrix4(n.matrixWorld); parts.push(m); });
  if(!had) return o; const w=new THREE.Group(); parts.forEach(m=>w.add(m)); return w; }

// ---- three setup ----
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
view.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x12161c);
const cam=new THREE.PerspectiveCamera(38,1,0.1,500);
scene.add(new THREE.HemisphereLight(0xdfeaff,0x2a2620,1.05));
const key=new THREE.DirectionalLight(0xfff2d8,1.4); key.position.set(6,10,7); scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,0.45); fill.position.set(-6,4,-4); scene.add(fill);
const grid=new THREE.GridHelper(20,20,0x33404c,0x222a32); scene.add(grid);
function resize(){ const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',resize);

// orbit
let orbit={az:0.5,el:0.25,r:9,tx:0,ty:2.2,tz:0};
function applyCam(){ const {az,el,r,tx,ty,tz}=orbit; cam.position.set(tx+Math.sin(az)*Math.cos(el)*r, ty+Math.sin(el)*r, tz+Math.cos(az)*Math.cos(el)*r); cam.lookAt(tx,ty,tz); }
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{ if(!drag)return; orbit.az-=(e.clientX-lx)*0.008; orbit.el=Math.max(-0.4,Math.min(1.2,orbit.el+(e.clientY-ly)*0.006)); lx=e.clientX;ly=e.clientY; applyCam(); });
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); orbit.r=Math.max(3,Math.min(30,orbit.r+e.deltaY*0.01)); applyCam(); },{passive:false});

// ---- loading ----
const status=document.getElementById('status');
function loadAll(){ return new Promise(res=>{
  const gl=new THREE.GLTFLoader(), fx=new THREE.FBXLoader(), tl=new THREE.TextureLoader();
  const propFiles=[...new Set(Object.values(WEAPONS).flat().map(w=>w.file))];
  let n=0, need=RIG_SPECS.length*2+propFiles.length; const done=()=>{ status.textContent='loading… '+(++n)+'/'+need; if(n>=need)res(); };
  RIG_SPECS.forEach(([k,f])=>{
    gl.load('/assets/models/'+f+'_anim.glb', g=>{ RIGS[k]={scene:g.scene,anims:g.animations}; done(); }, undefined, ()=>done());
    tl.load('/assets/models/'+f+'_tex.png', t=>{ t.flipY=true; t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false; if('colorSpace'in t)t.colorSpace=THREE.SRGBColorSpace; TEXS[k]=t; done(); }, undefined, ()=>done());
  });
  propFiles.forEach(f=>fx.load('/assets/models/'+f+'.fbx', o=>{ PROPS[f]=bakeStatic(o); done(); }, undefined, ()=>done()));
}); }

// ---- character builder (mirrors makeChar; returns per-prop refs so we can live-edit) ----
let cur=null; // {g,mixer,act,props:[{ref,def,bone}]}
function findBone(inner,anims,name){ const set=new Set(); anims.forEach(a=>a.tracks.forEach(t=>set.add(t.name.split('.')[0])));
  const cands=[]; inner.traverse(o=>{ if(o.isBone&&(o.name===name||o.name.indexOf(name)===0))cands.push(o); });
  cands.sort((a,b)=>{ const aa=set.has(a.name)?0:1, ba=set.has(b.name)?0:1; if(aa!==ba)return aa-ba; return (a.name===name?0:1)-(b.name===name?0:1); });
  return cands[0]||null; }
function build(key){
  if(cur){ scene.remove(cur.g); cur=null; }
  const src=RIGS[key]; if(!src){ status.textContent='missing rig: '+key; return; }
  const inner=THREE.SkeletonUtils.clone(src.scene), outer=new THREE.Group(); inner.rotation.y=0;
  inner.traverse(nd=>{ if(nd.isMesh){ nd.frustumCulled=false; const mm=nd.material; if(mm&&mm.map){ mm.map.magFilter=THREE.NearestFilter; mm.map.minFilter=THREE.NearestFilter; mm.map.generateMipmaps=false; } } });
  outer.add(inner); outer.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(inner); const hh=Math.max(0.001,bb.getSize(new THREE.Vector3()).y);
  inner.position.y=-bb.min.y; outer.scale.setScalar((CHAR_H[key]||4)/hh);
  const mixer=new THREE.AnimationMixer(inner); const act={};
  src.anims.forEach(a=>{ const clip=new THREE.AnimationClip(a.name,a.duration,a.tracks.filter(t=>!t.name.endsWith('.position'))); act[a.name]=mixer.clipAction(clip); });
  const idle=act.idle||act[Object.keys(act)[0]]; if(idle)idle.play();
  mixer.update(0.3); outer.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(inner); const c2=b2.getCenter(new THREE.Vector3());
  inner.position.y-=b2.min.y/outer.scale.x; inner.position.x-=c2.x/outer.scale.x; inner.position.z-=c2.z/outer.scale.x;
  const props=[];
  (WEAPONS[key]||[]).forEach(w=>{ if(!PROPS[w.file])return; const bone=findBone(inner,src.anims,w.bone);
    if(!bone)return; const prop=PROPS[w.file].clone(true), tx=TEXS[key];
    prop.traverse(o=>{ if(o.isMesh){ o.material=new THREE.MeshBasicMaterial({map:tx,side:THREE.DoubleSide}); o.frustumCulled=false; } });
    const def={pos:w.pos.slice(),rot:w.rot.slice(),scl:w.scl};
    prop.position.fromArray(def.pos); prop.rotation.set(def.rot[0],def.rot[1],def.rot[2]); prop.scale.setScalar(def.scl); bone.add(prop);
    props.push({ref:prop,def,file:w.file,bone:w.bone,boneReal:bone.name}); });
  scene.add(outer);
  cur={g:outer,mixer,act,key,props,anim:idle?(act.idle?'idle':Object.keys(act)[0]):null,pi:0};
  // frame camera to unit height
  const th=CHAR_H[key]||4; orbit.ty=th*0.5; orbit.r=th*2.2; applyCam();
  buildAnimChips(); buildPropChips(); selectProp(0);
  status.textContent=LABEL[key]+' — bones bound: '+props.map(p=>p.boneReal).join(', ');
}
function setAnim(want){ if(!cur||!cur.act[want])return; for(const k in cur.act){ if(k!==want)cur.act[k].fadeOut(0.15);} cur.act[want].reset().fadeIn(0.15).play(); cur.anim=want; buildAnimChips(); }

// ---- UI ----
const unitsEl=document.getElementById('units'), animsEl=document.getElementById('anims'), propsEl=document.getElementById('props');
RIG_SPECS.forEach(([k])=>{ const b=document.createElement('div'); b.className='u'; b.textContent=LABEL[k]||k; b.dataset.k=k; b.onclick=()=>{ [...unitsEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); build(k); }; unitsEl.appendChild(b); });
function buildAnimChips(){ animsEl.innerHTML=''; if(!cur)return; ['idle','run','attack','block'].forEach(a=>{ if(!cur.act[a])return; const c=document.createElement('div'); c.className='chip'+(cur.anim===a?' on':''); c.textContent=a; c.onclick=()=>setAnim(a); animsEl.appendChild(c); }); }
function buildPropChips(){ propsEl.innerHTML=''; if(!cur||cur.props.length<2)return; cur.props.forEach((p,i)=>{ const c=document.createElement('div'); c.className='chip'+(cur.pi===i?' on':''); c.textContent=p.file.split('_')[0]; c.onclick=()=>selectProp(i); propsEl.appendChild(c); }); }
const S={px:'px',py:'py',pz:'pz',rx:'rx',ry:'ry',rz:'rz',sc:'sc'};
function selectProp(i){ if(!cur||!cur.props[i])return; cur.pi=i; buildPropChips(); const p=cur.props[i], r=p.ref;
  set('px',r.position.x); set('py',r.position.y); set('pz',r.position.z);
  set('rx',r.rotation.x*R2D); set('ry',r.rotation.y*R2D); set('rz',r.rotation.z*R2D); set('sc',r.scale.x);
  document.getElementById('bone').textContent='prop: '+p.file+'.fbx  →  bone "'+p.bone+'" (bound: '+p.boneReal+')';
  syncOut(); }
function set(id,v){ const el=document.getElementById(id); el.value=v; document.getElementById('v'+id).textContent=(+v).toFixed(id==='sc'?2:(id[0]==='r'?0:2)); }
function readAndApply(){ if(!cur)return; const p=cur.props[cur.pi]; if(!p)return; const r=p.ref;
  const px=+g('px'),py=+g('py'),pz=+g('pz'),rx=+g('rx'),ry=+g('ry'),rz=+g('rz'),sc=+g('sc');
  r.position.set(px,py,pz); r.rotation.set(rx*D2R,ry*D2R,rz*D2R); r.scale.setScalar(sc);
  ['px','py','pz','rx','ry','rz','sc'].forEach(id=>document.getElementById('v'+id).textContent=(+g(id)).toFixed(id==='sc'?2:(id[0]==='r'?0:2)));
  syncOut(); }
function g(id){ return document.getElementById(id).value; }
['px','py','pz','rx','ry','rz','sc'].forEach(id=>document.getElementById(id).addEventListener('input',readAndApply));
function entryFor(key){ const arr=(WEAPONS[key]||[]).map((w,i)=>{ const p=(cur&&cur.key===key)?cur.props[i]:null; const r=p?p.ref:null;
    const pos=r?[+r.position.x.toFixed(2),+r.position.y.toFixed(2),+r.position.z.toFixed(2)]:w.pos;
    const rot=r?[fmtR(r.rotation.x),fmtR(r.rotation.y),fmtR(r.rotation.z)]:w.rot.map(fmtR);
    const scl=r?+r.scale.x.toFixed(2):w.scl;
    return `{file:'${w.file}', bone:'${w.bone}', pos:[${pos.join(',')}], rot:[${rot.join(',')}], scl:${scl}}`; });
  return `  ${key}:${' '.repeat(Math.max(1,10-key.length))}[${arr.join(',\n             ')}],`; }
function syncOut(){ if(!cur)return; document.getElementById('out').value=entryFor(cur.key); }
document.getElementById('copy').onclick=()=>{ const t=document.getElementById('out'); t.select(); navigator.clipboard&&navigator.clipboard.writeText(t.value); document.getElementById('copy').textContent='Copied!'; setTimeout(()=>document.getElementById('copy').textContent='Copy entry',900); };
document.getElementById('reset').onclick=()=>{ if(!cur)return; const p=cur.props[cur.pi]; p.ref.position.fromArray(p.def.pos); p.ref.rotation.set(p.def.rot[0],p.def.rot[1],p.def.rot[2]); p.ref.scale.setScalar(p.def.scl); selectProp(cur.pi); };
document.getElementById('dumpall').onclick=()=>{ const all=RIG_SPECS.map(([k])=>entryFor(k)).join('\n'); document.getElementById('out').value='const WEAPONS={\n'+all+'\n};'; };

// ---- loop ----
let last=performance.now();
function loop(t){ requestAnimationFrame(loop); const dt=(t-last)/1000; last=t; if(cur&&cur.mixer)cur.mixer.update(dt); renderer.render(scene,cam); }
resize(); applyCam(); loop(performance.now());
loadAll().then(()=>{ status.textContent='ready — pick a unit'; const first=unitsEl.querySelector('[data-k="orcgrunt"]')||unitsEl.firstChild; first.click(); });
window.__ready=()=>!!cur;
</script></body></html>
