server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;   # = the Vite dist/
    index index.html;

    # Hashed JS chunks + game models live under /assets. Content-hashed bundles are
    # immutable; models carry their own ?v= cache-buster — a day of caching is safe.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # The shell must always revalidate so a new build's hashed asset URLs reach clients at once.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/wasm;
    gzip_min_length 256;
}
